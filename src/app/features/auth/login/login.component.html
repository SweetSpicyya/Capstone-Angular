<main class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>ShiftManager</h1>
      <p class="auth-subtitle">Sign in to your account</p>
    </div>

    @if (errorMessage()) {
      <div class="error-banner">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="Username" autocomplete="username" />
        @if (isInvalid('username')) {
          <span class="error-message">Username is required.</span>
        }
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Password" autocomplete="current-password" />
        @if (isInvalid('password')) {
          <span class="error-message">Password is required.</span>
        }
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a routerLink="/register">Register here</a>
    </div>
  </div>
</main>
