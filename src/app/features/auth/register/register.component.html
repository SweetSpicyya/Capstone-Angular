<div class="auth-container">
  <div class="auth-card">
    <h2>Create Account</h2>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label>Account Role</label>
        <select formControlName="role">
          <option value="worker">Regular Worker</option>
          <option value="admin">Administrator</option>
        </select>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="example@mail.com" />
        <span class="error-message" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
          Invalid email address.
        </span>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="Min 6 chars (letters, numbers & symbols)" />
        <span class="error-message" *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.invalid">
          Min 6 chars with letters, numbers & symbols.
        </span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="At least 6 characters" />
        <span class="error-message" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
          Min 6 characters required.
        </span>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Confirm password" />
        <span class="error-message" *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched">
          Passwords do not match.
        </span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" formControlName="firstName" placeholder="Min 2 letters" />
          <span class="error-message" *ngIf="registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid">
            Min 2 letters required.
          </span>
        </div>

        <div class="form-group">
          <label>Last Name</label>
          <input type="text" formControlName="lastName" placeholder="Min 2 letters" />
          <span class="error-message" *ngIf="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid">
            Min 2 letters required.
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>Birth Date</label>
        <input type="date" formControlName="birthDate" />
        <span class="error-message" *ngIf="registerForm.get('birthDate')?.touched && registerForm.get('birthDate')?.invalid">
          Age must be between 6 and 130 years.
        </span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Registering...' : 'Register' }}
      </button>
    </form>

    <p class="auth-switch">
      Already have an account? <a routerLink="/login">Login here</a>
    </p>
  </div>
</div>
