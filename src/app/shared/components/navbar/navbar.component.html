<header class="navbar">
  <div class="nav-brand">
    <span class="logo">ShiftManager</span>
    @if (currentUser) {
      <span class="role-badge">{{ currentUser.role }}</span>
    }
  </div>

  @if (currentUser) {
    <nav class="nav-links">
      @if (currentUser.role === 'worker') {
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        <a routerLink="/shifts" routerLinkActive="active">My Shifts</a>
        <a routerLink="/shifts/new" routerLinkActive="active">Add Shift</a>
        <a routerLink="/profile" routerLinkActive="active">Profile</a>
      }

      @if (currentUser.role === 'admin') {
        <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
        <a routerLink="/admin/shifts" routerLinkActive="active">All Shifts</a>
        <a routerLink="/admin/workers" routerLinkActive="active">Workers</a>
      }
    </nav>

    <div class="nav-user">
      <span class="greeting">Hello, {{ currentUser.firstName }}</span>
      <button class="btn-logout" (click)="onLogout()">Logout</button>
    </div>
  }
</header>
